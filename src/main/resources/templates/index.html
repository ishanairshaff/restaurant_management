<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Restaurant List</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; background: #f9f9f9; }
        h2 { color: #333; }
        table { border-collapse: collapse; width: 100%; background: white; }
        th, td { border: 1px solid #ccc; padding: 10px 14px; text-align: left; }
        th { background-color: #4CAF50; color: white; }
        tr:nth-child(even) { background-color: #f2f2f2; }
        tr:hover { background-color: #e8f5e9; }

        .btn-add {
            background-color: #4CAF50;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
            margin-bottom: 16px;
        }
        .btn-add:hover { background-color: #388e3c; }
        .btn-edit {
            background-color: #2196F3;
            color: white;
            padding: 5px 12px;
            border: none;
            border-radius: 4px;
            text-decoration: none;
            margin-right: 6px;
        }
        .btn-edit:hover { background-color: #1565c0; }
        .btn-delete {
            background-color: #f44336;
            color: white;
            padding: 5px 12px;
            border: none;
            border-radius: 4px;
            text-decoration: none;
        }
        .btn-delete:hover { background-color: #b71c1c; }
    </style>
</head>
<body>

<h2>🍽Restaurant List</h2>

<!-- Add New Restaurant Button -->
<a class="btn-add" href="/new"> Add New Restaurant</a>

<table>
    <tr>
        <th>ID</th>
        <th>Name</th>
        <th>Location</th>
        <th>Rating</th>
        <th>Cuisine</th>
        <th>Action</th>
    </tr>
    <tr th:each="restaurant : ${listRestaurants}">
        <td th:text="${restaurant.id}"></td>
        <td th:text="${restaurant.name}"></td>
        <td th:text="${restaurant.location}"></td>
        <td th:text="${restaurant.rating}"></td>
        <td th:text="${restaurant.cuisine}"></td>
        <td>
            <!-- Triggers showEditForm route -->
            <a class="btn-edit" th:href="@{'/edit/' + ${restaurant.id}}"> Edit</a>

            <!--  Triggers deleteRestaurant route -->
            <a class="btn-delete" th:href="@{'/delete/' + ${restaurant.id}}"
               onclick="return confirm('Are you sure you want to delete this restaurant?')">Delete</a>
        </td>
    </tr>
</table>

</body>
</html>
